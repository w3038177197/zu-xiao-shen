services:
  - type: web
    name: zu-xiao-shen
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROXY_PROVIDER
        value: DeepSeek
      - key: AI_PROXY_MODEL
        value: deepseek-v4-flash
      - key: AI_PROXY_ALLOW_CUSTOM_UPSTREAM
        value: "false"
      - key: AI_PROXY_ALLOW_CLIENT_BASE_URL
        value: "false"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: WX_APPID
        value: wxa9ace892fd7b06e1
      - key: WX_SECRET
        sync: false
      - key: MINIAPP_SESSION_SECRET
        sync: false
      - key: MINIAPP_SESSION_TTL_SECONDS
        value: "7200"
      - key: AI_DAILY_QUOTA
        value: "20"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
